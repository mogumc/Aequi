name: Rust High-Performance Release

on:
  push:
    tags:
      - 'v*'
  # 开启手动触发，并允许输入版本号
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (例如 v1.0.0)'
        required: true
        default: 'manual-build'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  BINARY_NAME: aequi

jobs:
  test:
    name: Check & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust Cache
        uses: swatinem/rust-cache@v2

      - name: Check（含测试与示例代码）
        run: cargo check --all-targets --locked

      - name: Test
        run: cargo test --locked

  build:
    name: Build (${{ matrix.arch }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            arch: x86_64
            rustflags: "-C target-cpu=x86-64-v3"
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-gnu
            arch: arm64
            rustflags: "-C target-cpu=neoverse-n1"
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-unknown-linux-musl
            arch: x86_64-musl
            rustflags: "-C target-cpu=x86-64-v3"
            os: ubuntu-latest
            use_cross: true
          - target: aarch64-unknown-linux-musl
            arch: arm64-musl
            rustflags: "-C target-cpu=neoverse-n1"
            os: ubuntu-latest
            use_cross: true
          - target: x86_64-pc-windows-msvc
            arch: x86_64-windows
            rustflags: ""
            os: windows-latest
            use_cross: false

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Cross
        if: matrix.use_cross
        run: cargo install cross --git https://github.com/cross-rs/cross.git

      - name: Rust Cache
        uses: swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build Optimized Binary
        shell: bash
        run: |
          export RUSTFLAGS="${{ matrix.rustflags }} -C codegen-units=1 -C llvm-args=-inline-threshold=500"
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Prepare Release Assets
        shell: bash
        run: |
          mkdir -p ./dist

          # Windows 产物带 .exe；MSVC 的二进制不需要也不可用 binutils strip。
          EXT=""
          if [ "${{ matrix.use_cross }}" != "true" ]; then EXT=".exe"; fi
          SOURCE_BIN="target/${{ matrix.target }}/release/${{ env.BINARY_NAME }}${EXT}"
          strip "$SOURCE_BIN" 2>/dev/null || true

          # 只有手动触发时，文件名才会带上自定义输入的 tag
          # 自动触发时使用 github.ref_name (即 v1.0.x)
          TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          DEST_NAME="${{ env.BINARY_NAME }}-$TAG-${{ matrix.arch }}${EXT}"
          mv "$SOURCE_BIN" "./dist/$DEST_NAME"

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-asset-${{ matrix.arch }}
          path: ./dist/*
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download All Artifacts
        uses: actions/download-artifact@v4
        with:
          path: ./dist
          merge-multiple: true

      - name: List Assets
        run: ls -la ./dist/

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref }}
          generate_release_notes: true
          files: ./dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
