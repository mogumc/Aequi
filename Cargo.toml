[package]
name = "aequi"
version = "1.0.4"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
async-stream = "0.3.6"
async-trait = "0.1.92"
axum = "0.8.9"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-util = "0.3.34"
mime_guess = "2.0.5"
rand = "0.10.3"
reqwest = { version = "0.12", default-features = false, features = ["json", "socks", "rustls-tls", "http2", "stream"] }
rust-embed = "8.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha2 = "0.11.0"
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite", "chrono"] }
thiserror = "2.0.21"
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "signal", "time", "sync"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
totp-rs = { version = "6.0.0", features = ["gen_secret", "otpauth"] }
tower-http = { version = "0.7.1", features = ["cors"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
